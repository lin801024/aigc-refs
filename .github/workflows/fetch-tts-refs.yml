name: fetch-tts-refs
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-tts-refs.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ffmpeg
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - name: Download and normalize
        shell: bash
        run: |
          exec > >(tee diag.txt) 2>&1
          set +e
          rm -rf refs_std refs_mp3 tmp
          mkdir -p refs_std refs_mp3 tmp
          norm() {
            local out="$1"; local id="$2"
            echo "=== $out ($id) ==="
            curl -sL --retry 3 "https://aka.doubaocdn.com/s/$id" -o "tmp/$out.raw"
            echo "curl exit: $? size: $(stat -c%s tmp/$out.raw 2>/dev/null)"
            ffmpeg -hide_banner -loglevel error -y -i "tmp/$out.raw" -af "loudnorm=I=-20:TP=-2:LRA=11" -ac 1 -ar 44100 -c:a pcm_s16le "refs_std/$out.wav"
            ffmpeg -hide_banner -loglevel error -y -i "tmp/$out.raw" -af "loudnorm=I=-20:TP=-2:LRA=11" -ac 1 -ar 44100 -c:a libmp3lame -b:a 64k "refs_mp3/$out.mp3"
            echo "wav: $(stat -c%s refs_std/$out.wav 2>/dev/null)  mp3: $(stat -c%s refs_mp3/$out.mp3 2>/dev/null)"
          }
          norm 01_yaoniang dtHtO8351P
          norm 02_zhusheng uUqEk5hjC3
          norm 03_zhaohaiyou KMnlhr7ZDr
          norm 04_dayou WDcLz25Wgm
          echo "=== final ==="
          ls -la refs_mp3/
      - name: Commit and push
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add refs_std refs_mp3 diag.txt
          git commit -m "Update yaoniang to soft gentle voice; normalize refs to I=-20"
          git push
          echo "push exit: $?"
